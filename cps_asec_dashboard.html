<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPSP Poverty Day 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --ink:#1C2530;
    --ink-soft:#5B6675;
    --ink-faint:#8B94A0;
    --line:#DCE1E6;
    --navy:#2E4374;
    --navy-soft:#EAEFF6;
    --amber:#C98A2E;
    --amber-soft:#FBF1E1;
    --green:#3D7A5D;
    --green-soft:#E9F3EE;
    --grey:#8B94A0;
    --grey-soft:#EEF0F2;
    --ref-bg:#F0F0F0;
    --ref-text:#8B94A0;
    --needs-bg:#FBF3D2;
    --needs-border:#E0CE7E;
    --brick:#A24936;
    --brick-soft:#F7EAE7;
    --serif: 'Roboto', sans-serif;
    --sans: 'Roboto', -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: 'Roboto', ui-monospace, "SF Mono", "Consolas", monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:700;
    padding:28px 130px 60px 32px;
  }
  button, input{font-family:var(--sans);font-weight:700;}
  .wrap{max-width:1180px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    font-family:var(--serif);
    font-weight:800;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .date-pill{font-size:13px;color:var(--ink-soft);font-family:var(--mono);}

  .layout{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .panel-head{
    padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .panel-head h2{font-family:var(--serif);font-size:17px;margin:0;font-weight:800;}
  .panel-head .sub{font-size:12px;color:var(--ink-soft);}

  /* ---- Counters ---- */
  .counter-list{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .counter-row{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  }
  .counter-label-input{
    flex:1;font-size:13.5px;font-weight:700;border:1px solid transparent;background:transparent;
    padding:4px 6px;border-radius:3px;
  }
  .counter-label-input:hover, .counter-label-input:focus{border-color:var(--line);outline:none;background:var(--navy-soft);}
  .counter-controls{display:flex;align-items:center;gap:8px;}
  .counter-btn{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);
    font-size:15px;cursor:pointer;color:var(--navy);line-height:1;
  }
  .counter-btn:hover{background:var(--navy-soft);}
  .counter-value{font-family:var(--serif);font-size:18px;min-width:28px;text-align:center;}
  .counter-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:0 2px;}
  .counter-del:hover{color:var(--brick);}
  .counter-actions{padding:0 16px 16px;}

  /* ---- Project cards ---- */
  .project-list{padding:16px;display:flex;flex-direction:column;gap:12px;}
  .project-card{
    position:relative;
    border:1px solid var(--line);
    border-left:5px solid var(--grey);
    border-radius:6px;
    padding:14px 16px;
    background:var(--surface);
    overflow:hidden;
    transition:border-color .3s ease, background .3s ease, box-shadow .3s ease;
  }
  .project-card[data-stage="1"]{border-left-color:var(--amber);}
  .project-card[data-stage="2"]{border-left-color:var(--navy);}
  .project-card[data-stage="3"]{border-left-color:var(--green);background:var(--green-soft);box-shadow:0 2px 10px rgba(61,122,93,0.15);}

  .project-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .project-title-input{
    font-family:var(--serif);font-weight:700;font-size:16px;
    border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:3px;
    flex:1 1 200px;min-width:120px;color:var(--ink);
  }
  .project-title-input:hover, .project-title-input:focus{border-color:var(--line);outline:none;background:var(--surface);}
  .project-owner-input{
    font-size:12px;color:var(--ink-soft);border:1px solid transparent;background:transparent;
    padding:2px 4px;border-radius:3px;width:150px;text-align:right;
  }
  .project-owner-input:hover, .project-owner-input:focus{border-color:var(--line);outline:none;background:var(--surface);}

  .status-row{display:flex;gap:6px;flex-wrap:wrap;}
  .status-btn{
    font-size:12px;padding:6px 12px;border-radius:20px;
    border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);
    cursor:pointer;transition:all .18s ease;
  }
  .status-btn:hover{transform:translateY(-1px);border-color:var(--ink-faint);}
  .status-btn.active{color:#fff;border-color:transparent;}
  .status-btn[data-idx="0"].active{background:var(--grey);}
  .status-btn[data-idx="1"].active{background:var(--amber);}
  .status-btn[data-idx="2"].active{background:var(--navy);}
  .status-btn[data-idx="3"].active{background:var(--green);}

  .project-card.pulse{animation:cardPulse .35s ease;}
  @keyframes cardPulse{
    0%{transform:scale(1);}
    40%{transform:scale(1.015);}
    100%{transform:scale(1);}
  }
  .done-badge{
    position:absolute;top:12px;right:14px;font-size:18px;
    opacity:0;transform:scale(0.4) rotate(-15deg);
    transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .project-card[data-stage="3"] .done-badge{opacity:1;transform:scale(1) rotate(0deg);}

  .confetti-bit{
    position:absolute;top:50%;left:50%;font-size:13px;pointer-events:none;
    animation:confettiPop .7s ease-out forwards;
  }
  @keyframes confettiPop{
    0%{transform:translate(-50%,-50%) scale(0.6);opacity:1;}
    100%{transform:translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot));opacity:0;}
  }

  /* ---- Floating thermometer ---- */
  .thermo{
    position:fixed;right:0;top:0;height:100vh;width:78px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:60;background:var(--surface);border-left:1px solid var(--line);
    padding:24px 10px;box-shadow:-3px 0 12px rgba(28,37,48,0.06);
  }
  .thermo-title{
    font-size:10px;color:var(--ink-soft);writing-mode:vertical-rl;text-orientation:mixed;
    margin-bottom:12px;letter-spacing:0.3px;
  }
  .thermo-count{font-family:var(--serif);font-size:16px;color:var(--navy);margin-bottom:10px;}
  .thermo-tube{
    width:26px;flex:1 1 auto;min-height:80px;border:2px solid var(--ink);border-radius:13px 13px 3px 3px;
    background:var(--bg);position:relative;overflow:hidden;display:flex;align-items:flex-end;
  }
  .thermo-fill{width:100%;background:var(--brick);transition:height .5s ease, background .5s ease;}
  .thermo-tick{position:absolute;left:0;width:100%;height:1px;background:rgba(28,37,48,0.18);}
  .thermo-bulb{
    width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);flex-shrink:0;
    background:var(--bg);margin-top:-3px;display:flex;align-items:center;justify-content:center;
    transition:background .5s ease;
  }

  /* ---- Stats panel ---- */
  .cat{border-bottom:1px solid var(--line);}
  .cat:last-child{border-bottom:none;}
  .cat-head{padding:12px 18px 6px;font-size:13px;font-weight:700;color:var(--navy);}
  table.stat-table{width:100%;border-collapse:collapse;}
  table.stat-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:700;padding:4px 18px;}
  table.stat-table td{padding:5px 18px;font-size:13.5px;}
  table.stat-table td input{
    width:100%;border:1px solid transparent;background:transparent;font-family:var(--mono);
    font-size:13px;padding:4px 6px;border-radius:3px;color:var(--ink);
  }
  table.stat-table td input:hover{border-color:var(--line);}
  table.stat-table td input:focus{border-color:var(--navy);outline:none;background:var(--navy-soft);}
  table.stat-table td.label-cell input{font-family:var(--sans);}
  table.stat-table td input.ref-input{
    background:var(--ref-bg);color:var(--ref-text);cursor:default;
  }
  table.stat-table td input.ref-input:hover, table.stat-table td input.ref-input:focus{
    border-color:transparent;background:var(--ref-bg);
  }
  table.stat-table td input.needs-input{
    background:var(--needs-bg);border-color:var(--needs-border);
  }
  table.stat-table td input.needs-input:hover{border-color:var(--amber);}
  table.stat-table th.ref-col{color:var(--ref-text);}
  .diff-pos{color:var(--brick);font-family:var(--mono);}
  .diff-neg{color:var(--navy);font-family:var(--mono);}
  .diff-zero{color:var(--ink-soft);font-family:var(--mono);}
  .row-actions{padding:8px 18px 14px;}
  .add-btn{
    font-size:12px;color:var(--navy);background:none;border:1px dashed var(--line);
    padding:6px 11px;border-radius:3px;cursor:pointer;
  }
  .add-btn:hover{background:var(--navy-soft);}
  .del-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;padding:0 4px;}
  .del-btn:hover{color:var(--brick);}

  footer{margin-top:18px;font-size:11.5px;color:var(--ink-soft);text-align:right;}
  .save-note{opacity:0;transition:opacity .3s;}
  .save-note.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>CPSP Poverty Day 2026</h1>
    </div>
    <div class="date-pill" id="today"></div>
  </header>

  <div class="thermo">
    <div class="thermo-title">Products complete</div>
    <div class="thermo-count" id="thermo-count">0/4</div>
    <div class="thermo-tube">
      <div class="thermo-tick" style="bottom:25%"></div>
      <div class="thermo-tick" style="bottom:50%"></div>
      <div class="thermo-tick" style="bottom:75%"></div>
      <div class="thermo-fill" id="thermo-fill" style="height:0%"></div>
    </div>
    <div class="thermo-bulb" id="thermo-bulb"></div>
  </div>

  <div class="layout">

    <div class="panel">
      <div class="panel-head">
        <h2>Progress board</h2>
        <span class="sub">4 main projects</span>
      </div>
      <div id="project-list" class="project-list"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Other things to track</h2>
        <span class="sub">live counters</span>
      </div>
      <div id="counter-list" class="counter-list"></div>
      <div class="counter-actions"><button class="add-btn" id="add-counter-btn">+ add counter</button></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Poverty rate comparison</h2>
        <button class="add-btn" id="reset-stats-btn" title="Reload the 2024 figures and clear any entries">Reset to defaults</button>
      </div>
      <div id="stats-list"></div>
    </div>

  </div>

  <footer><span class="save-note" id="save-note">saved</span></footer>
</div>

<script>
const STAGES = ["Not started","In progress","Review","Done"];

const DEFAULT_PROJECTS = [
  { id:"p1", title:"Data files", owner:"S. / C.Y.", stage:0, updatedAt:null },
  { id:"p2", title:"Historical Market Poverty Brief", owner:"R. / D.", stage:0, updatedAt:null },
  { id:"p3", title:"Historical Databook", owner:"R. / S.", stage:0, updatedAt:null },
  { id:"p4", title:"State Report", owner:"D. / Y. (w/ C.Y. & O.)", stage:0, updatedAt:null },
];

const DEFAULT_STATS = {
  overall: { title:"Supplemental poverty rates", addable:false, rows:[{label:"Overall", report:"", microdata:"", cy2025:"", cy2024:"12.9"}] },
  age: { title:"Poverty rate by age", addable:true, rows:[
      {label:"Children", report:"", microdata:"", cy2025:"", cy2024:"13.4"},
      {label:"Working age", report:"", microdata:"", cy2025:"", cy2024:"12.2"},
      {label:"Elderly", report:"", microdata:"", cy2025:"", cy2024:"15.0"}
    ]},
  state: { title:"Poverty rate by state", addable:true, rows:[] }
};

let projects = null;
let stats = null;
let counters = null;

const DEFAULT_COUNTERS = [
  { id:"c1", label:"Media outlets we've spoken to", count:0 },
];

document.getElementById('today').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});

function flashSaved(){
  const el = document.getElementById('save-note');
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 900);
}

async function loadState(){
  try{
    const p = await window.storage.get('projects', false);
    projects = p ? JSON.parse(p.value) : DEFAULT_PROJECTS;
  }catch(e){ projects = DEFAULT_PROJECTS; }
  try{
    const s = await window.storage.get('stats', false);
    stats = s ? JSON.parse(s.value) : DEFAULT_STATS;
  }catch(e){ stats = DEFAULT_STATS; }
  try{
    const c = await window.storage.get('counters', false);
    counters = c ? JSON.parse(c.value) : DEFAULT_COUNTERS;
  }catch(e){ counters = DEFAULT_COUNTERS; }
  renderProjects();
  renderStats();
  renderCounters();
}
async function saveProjects(){
  try{ await window.storage.set('projects', JSON.stringify(projects), false); flashSaved(); }
  catch(e){ console.error('Failed to save projects', e); }
}
async function saveStats(){
  try{ await window.storage.set('stats', JSON.stringify(stats), false); flashSaved(); }
  catch(e){ console.error('Failed to save stats', e); }
}
async function saveCounters(){
  try{ await window.storage.set('counters', JSON.stringify(counters), false); flashSaved(); }
  catch(e){ console.error('Failed to save counters', e); }
}

function renderCounters(){
  const list = document.getElementById('counter-list');
  list.innerHTML = "";
  counters.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'counter-row';
    row.innerHTML = `
      <input class="counter-label-input" data-counter="${c.id}" value="${c.label}" placeholder="What are you tracking?"/>
      <div class="counter-controls">
        <button class="counter-btn" data-counter="${c.id}" data-delta="-1">&minus;</button>
        <span class="counter-value">${c.count}</span>
        <button class="counter-btn" data-counter="${c.id}" data-delta="1">+</button>
        <button class="counter-del" data-counter="${c.id}" title="Remove">&times;</button>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.counter-label-input').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const c = counters.find(x=>x.id===e.target.dataset.counter);
      c.label = e.target.value;
      saveCounters();
    });
  });
  list.querySelectorAll('.counter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = counters.find(x=>x.id===btn.dataset.counter);
      c.count = Math.max(0, c.count + parseInt(btn.dataset.delta,10));
      renderCounters();
      saveCounters();
    });
  });
  list.querySelectorAll('.counter-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      counters = counters.filter(x=>x.id!==btn.dataset.counter);
      renderCounters();
      saveCounters();
    });
  });
}
document.getElementById('add-counter-btn').addEventListener('click', ()=>{
  counters.push({ id:'c'+Date.now(), label:"New counter", count:0 });
  renderCounters();
  saveCounters();
});

function renderHero(){
  const done = projects.filter(p=>p.stage===3).length;
  const total = projects.length || 1;
  const pct = done/total*100;
  const hue = Math.round((pct/100) * 130);
  const color = `hsl(${hue}, 62%, 44%)`;
  document.getElementById('thermo-count').textContent = `${done}/${projects.length}`;
  const fillEl = document.getElementById('thermo-fill');
  fillEl.style.height = pct+'%';
  fillEl.style.background = color;
  document.getElementById('thermo-bulb').style.background = done > 0 ? color : '';
}

function spawnConfetti(cardEl){
  const bits = ['🎉','✨','⭐','🎊'];
  for(let i=0;i<8;i++){
    const span = document.createElement('span');
    span.className = 'confetti-bit';
    span.textContent = bits[Math.floor(Math.random()*bits.length)];
    const angle = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*30;
    span.style.setProperty('--dx', `${Math.cos(angle)*dist}px`);
    span.style.setProperty('--dy', `${Math.sin(angle)*dist - 20}px`);
    span.style.setProperty('--rot', `${(Math.random()*360-180)}deg`);
    cardEl.appendChild(span);
    setTimeout(()=>span.remove(), 750);
  }
}

function renderProjects(){
  const list = document.getElementById('project-list');
  list.innerHTML = "";
  projects.forEach(project=>{
    const card = document.createElement('div');
    card.className = 'project-card';
    card.dataset.stage = project.stage;
    let btns = "";
    STAGES.forEach((label,i)=>{
      btns += `<button class="status-btn ${project.stage===i ? 'active':''}" data-idx="${i}" data-project="${project.id}">${label}</button>`;
    });
    card.innerHTML = `
      <span class="done-badge">✅</span>
      <div class="project-head">
        <input class="project-title-input" data-project="${project.id}" data-field="title" value="${project.title}" placeholder="Project name"/>
        <input class="project-owner-input" data-project="${project.id}" data-field="owner" value="${project.owner}" placeholder="Names / initials"/>
      </div>
      <div class="status-row">${btns}</div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.project-title-input, .project-owner-input').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const { project: projId, field } = e.target.dataset;
      const p = projects.find(x=>x.id===projId);
      p[field] = e.target.value;
      saveProjects();
    });
  });

  list.querySelectorAll('.status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { project: projId, idx } = btn.dataset;
      const p = projects.find(x=>x.id===projId);
      const newStage = parseInt(idx,10);
      const wasDone = p.stage === 3;
      p.stage = newStage;
      p.updatedAt = new Date().toISOString();
      renderProjects();
      renderHero();
      saveProjects();
      const cardIdx = projects.findIndex(x=>x.id===projId);
      const card = list.children[cardIdx];
      if(card){
        card.classList.add('pulse');
        setTimeout(()=>card.classList.remove('pulse'), 350);
        if(newStage === 3 && !wasDone){ spawnConfetti(card); }
      }
    });
  });

  renderHero();
}

function computeDiff(report, microdata){
  const r = parseFloat(report), m = parseFloat(microdata);
  if(isNaN(r) || isNaN(m)) return {text:"—", cls:"diff-zero"};
  const d = (m - r);
  const cls = d === 0 ? "diff-zero" : (d > 0 ? "diff-pos" : "diff-neg");
  const sign = d > 0 ? "+" : "";
  return {text: `${sign}${d.toFixed(1)} pp`, cls};
}

function renderStats(){
  const container = document.getElementById('stats-list');
  container.innerHTML = "";
  Object.entries(stats).forEach(([key, cat])=>{
    const catEl = document.createElement('div');
    catEl.className = 'cat';
    let rowsHtml = "";
    cat.rows.forEach((row, i)=>{
      const diff = computeDiff(row.report, row.microdata);
      const needsClass = v => (!v || !v.trim()) ? 'needs-input' : '';
      rowsHtml += `
        <tr>
          <td class="label-cell"><input data-cat="${key}" data-idx="${i}" data-field="label" value="${row.label}" placeholder="Label"/></td>
          <td><input class="${needsClass(row.report)}" data-cat="${key}" data-idx="${i}" data-field="report" value="${row.report}" placeholder="—"/></td>
          <td><input class="${needsClass(row.microdata)}" data-cat="${key}" data-idx="${i}" data-field="microdata" value="${row.microdata}" placeholder="—"/></td>
          <td class="${diff.cls}">${diff.text}</td>
          <td><input class="${needsClass(row.cy2025)}" data-cat="${key}" data-idx="${i}" data-field="cy2025" value="${row.cy2025||''}" placeholder="—"/></td>
          <td><input class="ref-input" data-cat="${key}" data-idx="${i}" data-field="cy2024" value="${row.cy2024||''}" placeholder="—" readonly/></td>
          <td>${cat.addable ? `<button class="del-btn" data-cat="${key}" data-idx="${i}" title="Remove row">&times;</button>` : ""}</td>
        </tr>`;
    });
    catEl.innerHTML = `
      <div class="cat-head"><span>${cat.title}</span></div>
      <table class="stat-table">
        <tr><th style="width:26%">&nbsp;</th><th>Report</th><th>Microdata</th><th>Diff</th><th>2025 CPS ASEC</th><th class="ref-col">2024 CPS ASEC</th><th></th></tr>
        ${rowsHtml}
      </table>
      ${cat.addable ? `<div class="row-actions"><button class="add-row-btn add-btn" data-cat="${key}">+ add row</button></div>` : ""}
    `;
    container.appendChild(catEl);
  });

  container.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const {cat, idx, field} = e.target.dataset;
      stats[cat].rows[idx][field] = e.target.value;
      saveStats();
      if(field !== 'label' && field !== 'cy2024'){
        e.target.classList.toggle('needs-input', !e.target.value.trim());
      }
      const diffCell = e.target.closest('tr').querySelector('td:nth-child(4)');
      const diff = computeDiff(stats[cat].rows[idx].report, stats[cat].rows[idx].microdata);
      diffCell.textContent = diff.text;
      diffCell.className = diff.cls;
    });
  });
  container.querySelectorAll('.add-row-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      stats[btn.dataset.cat].rows.push({label:"", report:"", microdata:""});
      renderStats();
      saveStats();
    });
  });
  container.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const {cat, idx} = btn.dataset;
      stats[cat].rows.splice(idx,1);
      renderStats();
      saveStats();
    });
  });
}

document.getElementById('reset-stats-btn').addEventListener('click', ()=>{
  if(confirm('Reset the comparison table to the default 2024 figures? This clears anything typed into Report, Microdata, or 2025 CPS ASEC.')){
    stats = JSON.parse(JSON.stringify(DEFAULT_STATS));
    renderStats();
    saveStats();
  }
});

loadState();
</script>
</body>
</html>
