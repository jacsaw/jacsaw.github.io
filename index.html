<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNAP Eligibility Changes Under the One Big Beautiful Bill Act</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1 class="sr-only">
    SNAP eligibility changes under the One Big Beautiful Bill Act of 2025,
    implementation timeline with US map
  </h1>

  <div id="shell">

    <!-- Timeline column -->
    <div id="timeline-col"></div>

    <!-- Map column -->
    <div id="map-col">
      <div id="map-header">
        <div id="month-label">Loading…</div>
        <span id="active-cat" class="event-tag tag-restrict"></span>
        <div id="active-desc"></div>
      </div>

      <div id="map-wrap">
        <svg id="map-svg" viewBox="0 0 960 580" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="tooltip"></div>
      </div>

      <div id="legend"></div>
    </div>

  </div>

  <!-- Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

  <!-- App script (loads data.json, builds timeline + map) -->
  <script src="script.js"></script>

</body>
</html>
